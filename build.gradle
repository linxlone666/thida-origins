buildscript {
    if (project.hasProperty('withConnector')) {
        repositories { maven { url = 'https://maven.sinytra.org/' } }
        dependencies { classpath 'org.sinytra.adapter:userdev:1.2.1-SNAPSHOT' }
    }
}
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
if (project.hasProperty('withConnector')) apply plugin: 'org.sinytra.adapter.userdev'
group = 'dev.thida'
version = providers.gradleProperty('mod_version').get()
base.archivesName = 'thida-origins-1.21.1-neoforge'
layout.buildDirectory = layout.projectDirectory.dir('build-neoforge')
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    formatter
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly, localRuntime
    gametestCompileOnly.extendsFrom compileOnly
    runtimeClasspath.extendsFrom localRuntime
}
neoForge {
    version = '21.1.233'
    addModdingDependenciesTo sourceSets.gametest
    addModdingDependenciesTo sourceSets.test
    runs {
        client { client() }
        singleplayerSmoke {
            client()
            sourceSet = sourceSets.gametest
            systemProperty 'thida.singleplayerSmoke', 'true'
            gameDirectory = project.file('run-neoforge-singleplayer-smoke')
        }
        worldJoinSmoke {
            client()
            sourceSet = sourceSets.gametest
            systemProperty 'thida.worldJoinSmoke', 'true'
            gameDirectory = project.file('run-neoforge-world-join-smoke')
        }
        uiSmoke {
            client()
            sourceSet = sourceSets.gametest
            systemProperty 'thida.worldJoinSmoke', 'true'
            systemProperty 'thida.uiSmoke', 'true'
            gameDirectory = project.file('run-neoforge-world-join-smoke')
        }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', 'thida'
            gameDirectory = project.file('run-neoforge-gametest')
        }
        configureEach {
            if (name != 'gameTestServer' && name != 'singleplayerSmoke' && name != 'worldJoinSmoke' && name != 'uiSmoke') gameDirectory = project.file('run-neoforge')
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        thida {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}
repositories {
    mavenCentral()
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url = 'https://code.redspace.io/releases' }
    maven { url = 'https://code.redspace.io/snapshots' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.kosmx.dev/' }
    maven { url = 'https://maven.theillusivec4.top/' }
}
dependencies {
    formatter 'com.google.googlejavaformat:google-java-format:1.24.0:all-deps'
    if (providers.gradleProperty('fakePlayerProfile').isPresent()) {
        def profile = providers.gradleProperty('fakePlayerProfile').get()
        localRuntime files(new File(profile, 'mods/advancedfakeplayers-neoforge-1.21.1-1.0.0.jar'))
        localRuntime files(new File(profile, 'mods/carryon-neoforge-1.21.1-2.2.4.4.jar'))
    }
    // Optional, local compatibility reproduction using the exact FFAPI JAR in a supplied profile.
    if (providers.gradleProperty('compatProfile').isPresent()) {
        localRuntime files(new File(providers.gradleProperty('compatProfile').get(),
                'mods/forgified-fabric-api-0.116.14+2.3.0+1.21.1.jar'))
        if (project.hasProperty('withConnector')) {
            additionalRuntimeClasspath files(new File(providers.gradleProperty('compatProfile').get(),
                    'mods/connector-2.0.0-beta.15+1.21.1-full.jar'))
        }
        if (project.hasProperty('allProfileMods')) {
            localRuntime fileTree(new File(providers.gradleProperty('compatProfile').get(), 'mods')) {
                include '*.jar'
                exclude 'thida-*.jar', 'connector-*.jar', 'forgified-fabric-api-*.jar'
            }
        }
    }
    implementation 'curse.maven:origins-neoforge-1375372:8842849'
    localRuntime 'curse.maven:jupiter-1072905:7738312'
    compileOnly 'io.redspace:irons_spellbooks:1.21.1-3.16.3:api'
    if (!providers.gradleProperty('withoutIron').map { it.toBoolean() }.getOrElse(false)) {
        localRuntime 'io.redspace:irons_spellbooks:1.21.1-3.16.3'
        localRuntime 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.5.1'
        localRuntime 'dev.kosmx.player-anim:player-animation-lib-forge:2.0.4+1.21.1'
        localRuntime 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
        localRuntime 'io.redspace:irons_lib:1.21.1-2.1.0'
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('formatJava', JavaExec) {
    classpath = configurations.formatter
    mainClass = 'com.google.googlejavaformat.java.Main'
    jvmArgs(['api', 'file', 'parser', 'tree', 'util', 'code'].collect { "--add-exports=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED" })
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    args '--replace'
    args fileTree('src') { include '**/*.java' }.files.collect { it.absolutePath }.sort()
}
processResources {
    inputs.property('mod_version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: project.version) }
}
test { useJUnitPlatform() }
tasks.register('compileExamples', JavaCompile) {
    dependsOn classes
    source fileTree('docs/examples') { include '*.java' }
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    destinationDirectory = layout.buildDirectory.dir('classes/examples')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
}
check.dependsOn 'compileExamples'

tasks.register('verifySingleplayerSmoke') {
    dependsOn 'runSingleplayerSmoke'
    doLast {
        def log = file('run-neoforge-singleplayer-smoke/logs/latest.log')
        if (!log.exists() || !log.text.contains('THIDA_SINGLEPLAYER_SMOKE_PASS'))
            throw new GradleException('Singleplayer did not reach the Create World screen')
    }
}
tasks.register('verifyWorldJoinSmoke') {
    dependsOn 'runWorldJoinSmoke'
    doLast {
        def log = file('run-neoforge-world-join-smoke/logs/latest.log')
        if (!log.exists() || !log.text.contains('THIDA_WORLD_JOIN_SMOKE_PASS')
                || !log.text.contains('THIDA_AFP_RESTORE_COMPLETE'))
            throw new GradleException('Copied world did not load with saved bots')
    }
}
tasks.register('originDatapack', Zip) {
    archiveFileName = 'thida-origin-1.21.1-neoforge.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('src/main/resources') { include 'pack.mcmeta'; include 'data/**' }
}
